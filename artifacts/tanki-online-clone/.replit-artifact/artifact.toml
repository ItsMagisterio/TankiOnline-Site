kind = "web"
previewPath = "/"
title = "Tanki Online"
description = "Точная реконструкция игровой стартовой страницы Tanki Online по предоставленному референсу и исходному сайту."
version = "1.0.0"
id = "artifacts/tanki-online-clone"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21622

[services.development]
run = "pnpm --filter @workspace/tanki-online-clone run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tanki-online-clone", "run", "build" ]
serve = "static"
publicDir = "artifacts/tanki-online-clone/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21622"
BASE_PATH = "/"
